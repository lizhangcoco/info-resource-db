<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 绿通采购货物比价参考平台</title>
    <link rel="stylesheet" href="/bijia/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3H5L5.4 5M7 13H17L19 5H5.4M7 13L5.4 5M7 13L4.5 15.5C4.1 15.9 3.8 16.5 4 17C4.2 17.5 4.8 18 5.5 18H18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9" cy="20" r="1.5" fill="white"/>
                        <circle cx="18" cy="20" r="1.5" fill="white"/>
                    </svg>
                </div>
                <div class="login-title">
                    <h1>绿通采购货物比价参考平台</h1>
                    <p>选择您的身份进入系统</p>
                </div>
            </div>

            <!-- 角色选择区 -->
            <div class="role-selector" id="roleSelector">
                <div class="role-card buyer-card active" onclick="selectRole('buyer', this)">
                    <div class="role-icon buyer-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 3h2l2.4 12.6a2 2 0 002 1.4h8.7a2 2 0 002-1.6L22 7H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M7 7h14l-1.5 2.5H6.5L7 7z" fill="currentColor" opacity="0.4"/>
                            <path d="M10 20a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM19 20a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="role-name">采购人</span>
                </div>
                <div class="role-card supplier-card" onclick="selectRole('supplier', this)">
                    <div class="role-icon supplier-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 20h18v-9l-9-5-9 5v9z" fill="currentColor" opacity="0.4"/>
                            <path d="M3 20h18v-9l-9-5-9 5v9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M9 20v-5h6v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M4.5 10l3 1.5M19.5 10l-3 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="role-name">供应商</span>
                </div>
                <div class="role-card admin-card" onclick="selectRole('admin', this)">
                    <div class="role-icon admin-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V5l8-3z" fill="currentColor" opacity="0.4"/>
                            <path d="M12 2l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V5l8-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M8 12l3 3 5-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span class="role-name">管理员</span>
                </div>
            </div>

            <!-- 采购人：登录表单 -->
            <form class="login-form" id="buyerLoginForm" onsubmit="handleLogin(event, 'buyer')">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-full btn-buyer">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    采购人登录
                </button>
                <div class="form-switch">
                    还没有账号？<a href="javascript:switchToRegister('buyer')">立即注册</a>
                </div>
                <div class="form-error" id="loginError"></div>
            </form>

            <!-- 采购人：注册表单 -->
            <form class="login-form" id="buyerRegisterForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="regUsername" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">公司名称</label>
                    <input type="text" id="regCompany" placeholder="选填">
                </div>
                <div class="form-group">
                    <label class="form-label">联系电话</label>
                    <input type="tel" id="regPhone" placeholder="选填">
                </div>
                <button type="submit" class="btn btn-full btn-buyer">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    注册采购人账号
                </button>
                <div class="form-switch">
                    已有账号？<a href="javascript:switchToLogin('buyer')">返回登录</a>
                </div>
                <div class="form-error" id="registerError"></div>
            </form>

            <!-- 供应商：登录表单 -->
            <form class="login-form" id="supplierLoginForm" onsubmit="handleLogin(event, 'supplier')" style="display: none;">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="supLoginUsername" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="supLoginPassword" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-full btn-supplier">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    供应商登录
                </button>
                <div class="form-switch">
                    还没有账号？<a href="javascript:switchToRegister('supplier')">立即入驻</a>
                </div>
                <div class="form-error" id="supLoginError"></div>
            </form>

            <!-- 供应商：入驻表单 -->
            <form class="login-form" id="supplierRegisterForm" onsubmit="handleSupplierRegister(event)" style="display: none;">
                <div class="form-group">
                    <label class="form-label">登录用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="supUsername" placeholder="请输入登录用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">登录密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="supPassword" placeholder="请输入密码（至少6位）" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">公司/供应商名称 <span class="form-required">*</span></label>
                    <input type="text" id="supCompany" placeholder="请输入公司/供应商名称" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">联系人</label>
                        <input type="text" id="supContact" placeholder="联系人姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系电话</label>
                        <input type="tel" id="supPhone" placeholder="联系电话">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">营业执照号</label>
                    <input type="text" id="supLicense" placeholder="选填，用于资质审核">
                </div>
                <div class="form-group">
                    <label class="form-label">公司地址</label>
                    <input type="text" id="supAddress" placeholder="选填">
                </div>
                <div class="form-hint supplier-hint">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    提交后将由管理员审核，审核通过后即可登录
                </div>
                <button type="submit" class="btn btn-full btn-supplier">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    提交入驻申请
                </button>
                <div class="form-switch">
                    已有账号？<a href="javascript:switchToLogin('supplier')">返回登录</a>
                </div>
                <div class="form-error" id="supplierError"></div>
            </form>

            <!-- 管理员：登录表单 -->
            <form class="login-form" id="adminLoginForm" onsubmit="handleLogin(event, 'admin')" style="display: none;">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="adminUsername" placeholder="请输入管理员用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="adminPassword" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-full btn-admin">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    管理员登录
                </button>
                <div class="form-error" id="adminLoginError"></div>
            </form>

            <div class="login-footer">
                <p>如有问题，请联系管理员</p>
            </div>
        </div>
    </div>

    <script>
        window.API_BASE = '/bijia';
        let currentRole = 'buyer';

        function selectRole(role, el) {
            currentRole = role;
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            switchToLogin(role);
        }

        function switchToLogin(role) {
            hideAllForms();
            if (role === 'buyer') {
                document.getElementById('buyerLoginForm').style.display = 'block';
            } else if (role === 'supplier') {
                document.getElementById('supplierLoginForm').style.display = 'block';
            } else if (role === 'admin') {
                document.getElementById('adminLoginForm').style.display = 'block';
            }
            clearErrors();
        }

        function switchToRegister(role) {
            hideAllForms();
            if (role === 'buyer') {
                document.getElementById('buyerRegisterForm').style.display = 'block';
            } else if (role === 'supplier') {
                document.getElementById('supplierRegisterForm').style.display = 'block';
            }
            clearErrors();
        }

        function hideAllForms() {
            ['buyerLoginForm', 'buyerRegisterForm', 'supplierLoginForm', 'supplierRegisterForm', 'adminLoginForm'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
        }

        function clearErrors() {
            ['loginError', 'registerError', 'supLoginError', 'supplierError', 'adminLoginError'].forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
        }

        async function handleLogin(e, role) {
            e.preventDefault();
            let username, password, errorId;
            if (role === 'buyer') {
                username = document.getElementById('loginUsername').value.trim();
                password = document.getElementById('loginPassword').value.trim();
                errorId = 'loginError';
            } else if (role === 'supplier') {
                username = document.getElementById('supLoginUsername').value.trim();
                password = document.getElementById('supLoginPassword').value.trim();
                errorId = 'supLoginError';
            } else {
                username = document.getElementById('adminUsername').value.trim();
                password = document.getElementById('adminPassword').value.trim();
                errorId = 'adminLoginError';
            }

            try {
                const resp = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                const data = await resp.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    const userRole = data.user.role;
                    if (userRole === 'admin') {
                        window.location.href = API_BASE + '/admin';
                    } else if (userRole === 'supplier') {
                        window.location.href = API_BASE + '/supplier';
                    } else {
                        window.location.href = API_BASE + '/';
                    }
                } else {
                    document.getElementById(errorId).innerHTML = data.error || '登录失败';
                }
            } catch (err) {
                document.getElementById(errorId).innerHTML = '网络错误，请重试';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const company = document.getElementById('regCompany').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (password.length < 6) {
                document.getElementById('registerError').innerHTML = '密码长度至少6位';
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, company_name: company, phone, role: 'buyer' })
                });
                const data = await resp.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = API_BASE + '/';
                } else {
                    document.getElementById('registerError').innerHTML = data.error || '注册失败';
                }
            } catch (err) {
                document.getElementById('registerError').innerHTML = '网络错误，请重试';
            }
        }

        async function handleSupplierRegister(e) {
            e.preventDefault();
            const username = document.getElementById('supUsername').value.trim();
            const password = document.getElementById('supPassword').value.trim();
            const company = document.getElementById('supCompany').value.trim();
            const contact = document.getElementById('supContact').value.trim();
            const phone = document.getElementById('supPhone').value.trim();
            const license = document.getElementById('supLicense').value.trim();
            const address = document.getElementById('supAddress').value.trim();

            if (password.length < 6) {
                document.getElementById('supplierError').innerHTML = '密码长度至少6位';
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        company_name: company,
                        supplier_name: company,
                        contact_name: contact,
                        phone,
                        business_license: license,
                        address,
                        role: 'supplier'
                    })
                });
                const data = await resp.json();

                if (data.success) {
                    alert('入驻申请提交成功！请等待管理员审核，审核通过后即可登录。');
                    switchToLogin('supplier');
                } else {
                    document.getElementById('supplierError').innerHTML = data.error || '提交失败';
                }
            } catch (err) {
                document.getElementById('supplierError').innerHTML = '网络错误，请重试';
            }
        }
    </script>
</body>
</html>
