# ============================================================
# 电商比价系统 - Nginx 子目录反向代理配置
# 部署路径: /bijia/
# 使用方式: 将此文件内容添加到现有 Nginx 配置中
# ============================================================

# -------------------------------------------
# 方式一：将以下内容添加到现有网站的 server 块内
# -------------------------------------------

    # 静态资源（可选，比价工具页面）
    # location /bijia/static/ {
    #     alias /www/bijia-system/web/static/;
    #     expires 30d;
    # }

    # API 反向代理到后端服务
    location /bijia/api/ {
        proxy_pass http://127.0.0.1:8081/bijia/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 主页面代理（将 /bijia/* 请求转发到 Flask）
    location /bijia/ {
        proxy_pass http://127.0.0.1:8081/bijia/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

