<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 绿通采购货物比价参考平台</title>
    <link rel="stylesheet" href="/bijia/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3H5L5.4 5M7 13H17L19 5H5.4M7 13L5.4 5M7 13L4.5 15.5C4.1 15.9 3.8 16.5 4 17C4.2 17.5 4.8 18 5.5 18H18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9" cy="20" r="1.5" fill="white"/>
                        <circle cx="18" cy="20" r="1.5" fill="white"/>
                    </svg>
                </div>
                <div class="login-title">
                    <h1>绿通采购货物比价参考平台</h1>
                    <p>选择您的身份，登录后享受完整比价服务</p>
                </div>
            </div>

            <!-- 角色选择区 -->
            <div class="role-selector" id="roleSelector">
                <div class="role-card active" onclick="selectRole('login', this)">
                    <div class="role-icon login-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="role-info">
                        <span class="role-name">用户登录</span>
                        <span class="role-desc">采购人/供应商/管理员</span>
                    </div>
                </div>
                <div class="role-card" onclick="selectRole('register', this)">
                    <div class="role-icon buyer-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="role-info">
                        <span class="role-name">采购人注册</span>
                        <span class="role-desc">比价采购、发起询价</span>
                    </div>
                </div>
                <div class="role-card" onclick="selectRole('supplier', this)">
                    <div class="role-icon supplier-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h2M9 13h2M9 17h2M13 9h2M13 13h2M13 17h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="role-info">
                        <span class="role-name">供应商入驻</span>
                        <span class="role-desc">提供商品服务、报价响应</span>
                    </div>
                </div>
            </div>

            <!-- 登录表单 -->
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    登录
                </button>
                <div class="form-error" id="loginError"></div>
            </form>

            <!-- 采购人注册表单 -->
            <form class="login-form" id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="register-banner buyer-banner">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>采购人注册 — 比价采购、发起询价</span>
                </div>
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="regUsername" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">公司名称</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M23 21v-2a4 4 0 00-3-3.87" stroke="currentColor" stroke-width="2"/>
                            <path d="M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="regCompany" placeholder="选填">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">联系电话</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="tel" id="regPhone" placeholder="选填">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    注册采购人账号
                </button>
                <div class="form-error" id="registerError"></div>
            </form>

            <!-- 供应商入驻表单 -->
            <form class="login-form" id="supplierForm" onsubmit="handleSupplierRegister(event)" style="display: none;">
                <div class="register-banner supplier-banner">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h2M9 13h2M9 17h2M13 9h2M13 13h2M13 17h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>供应商入驻 — 提供商品服务、报价响应</span>
                </div>
                <div class="form-group">
                    <label class="form-label">登录用户名</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="text" id="supUsername" placeholder="请输入登录用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">登录密码</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <input type="password" id="supPassword" placeholder="请输入密码（至少6位）" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">公司/供应商名称 <span class="form-required">*</span></label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h2M9 13h2M9 17h2M13 9h2M13 13h2M13 17h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="text" id="supCompany" placeholder="请输入公司/供应商名称" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">联系人</label>
                        <input type="text" id="supContact" placeholder="联系人姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系电话</label>
                        <input type="tel" id="supPhone" placeholder="联系电话">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">营业执照号</label>
                    <input type="text" id="supLicense" placeholder="选填，用于资质审核">
                </div>
                <div class="form-group">
                    <label class="form-label">公司地址</label>
                    <input type="text" id="supAddress" placeholder="选填">
                </div>
                <div class="form-hint supplier-hint">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    提交后将由管理员审核，审核通过后即可登录使用
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    提交入驻申请
                </button>
                <div class="form-error" id="supplierError"></div>
            </form>

            <div class="login-footer">
                <p>如有问题，请联系管理员</p>
            </div>
        </div>
    </div>

    <script>
        window.API_BASE = '/bijia';

        function selectRole(tab, el) {
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('supplierForm').style.display = tab === 'supplier' ? 'block' : 'none';
            document.getElementById('loginError').innerHTML = '';
            document.getElementById('registerError').innerHTML = '';
            document.getElementById('supplierError').innerHTML = '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const resp = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    const role = data.user.role;
                    if (role === 'admin') {
                        window.location.href = API_BASE + '/admin';
                    } else if (role === 'supplier') {
                        window.location.href = API_BASE + '/supplier';
                    } else {
                        window.location.href = API_BASE + '/';
                    }
                } else {
                    document.getElementById('loginError').innerHTML = data.error || '登录失败';
                }
            } catch (err) {
                document.getElementById('loginError').innerHTML = '网络错误，请重试';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const company = document.getElementById('regCompany').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (password.length < 6) {
                document.getElementById('registerError').innerHTML = '密码长度至少6位';
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, company_name: company, phone, role: 'buyer' })
                });
                const data = await resp.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = API_BASE + '/';
                } else {
                    document.getElementById('registerError').innerHTML = data.error || '注册失败';
                }
            } catch (err) {
                document.getElementById('registerError').innerHTML = '网络错误，请重试';
            }
        }

        async function handleSupplierRegister(e) {
            e.preventDefault();
            const username = document.getElementById('supUsername').value.trim();
            const password = document.getElementById('supPassword').value.trim();
            const company = document.getElementById('supCompany').value.trim();
            const contact = document.getElementById('supContact').value.trim();
            const phone = document.getElementById('supPhone').value.trim();
            const license = document.getElementById('supLicense').value.trim();
            const address = document.getElementById('supAddress').value.trim();

            if (password.length < 6) {
                document.getElementById('supplierError').innerHTML = '密码长度至少6位';
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        company_name: company,
                        supplier_name: company,
                        contact_name: contact,
                        phone,
                        business_license: license,
                        address,
                        role: 'supplier'
                    })
                });
                const data = await resp.json();

                if (data.success) {
                    alert('入驻申请提交成功！请等待管理员审核，审核通过后即可登录。');
                    selectRole('login', document.querySelector('.role-card'));
                } else {
                    document.getElementById('supplierError').innerHTML = data.error || '提交失败';
                }
            } catch (err) {
                document.getElementById('supplierError').innerHTML = '网络错误，请重试';
            }
        }
    </script>
</body>
</html>
