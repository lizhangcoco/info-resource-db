<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应商管理后台 - 绿通采购货物比价参考平台</title>
    <link rel="stylesheet" href="/bijia/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-inner">
                <div class="header-top">
                    <div class="logo-section">
                        <div class="logo-icon" onclick="window.location.href='/bijia/'">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 20h18v-9l-9-5-9 5v9z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M9 20v-5h6v5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="logo-text">
                            <h1>供应商管理后台</h1>
                            <p id="supplierName">管理我的货物与服务</p>
                        </div>
                    </div>
                    <div class="header-actions" id="headerActions">
                        <button class="upload-btn" onclick="window.location.href='/bijia/'">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            返回比价
                        </button>
                        <div class="user-menu" onclick="toggleUserDropdown(event)">
                            <div class="user-avatar" id="userAvatar">U</div>
                            <div class="user-info">
                                <span class="user-name" id="userName">用户</span>
                                <span class="user-role">供应商</span>
                            </div>
                            <svg class="user-dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <div class="user-dropdown" id="userDropdown">
                                <div class="dropdown-item" onclick="handleLogout()">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                    退出登录
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- 统计卡片 -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon goods-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="goodsCount">0</span>
                        <span class="stat-label">货物商品</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon service-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="serviceCount">0</span>
                        <span class="stat-label">服务项目</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon price-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="avgPrice">0</span>
                        <span class="stat-label">平均价格</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon total-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="totalCount">0</span>
                        <span class="stat-label">商品总数</span>
                    </div>
                </div>
            </div>

            <!-- 筛选和操作栏 -->
            <div class="category-filters">
                <div class="filter-section">
                    <label class="filter-label">类型</label>
                    <select class="filter-select" id="productType" onchange="loadCategories()">
                        <option value="">全部</option>
                        <option value="goods">货物</option>
                        <option value="service">服务</option>
                    </select>
                </div>
                <div class="filter-section">
                    <label class="filter-label">一级分类</label>
                    <select class="filter-select" id="mainCategory" onchange="loadSubCategories()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-section">
                    <label class="filter-label">二级分类</label>
                    <select class="filter-select" id="subCategory">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-section filter-search">
                    <input type="text" id="searchKeyword" placeholder="搜索商品名称..." onkeydown="if(event.key==='Enter') loadProducts()">
                    <button class="search-btn-sm" onclick="loadProducts()">搜索</button>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
                    <button class="btn btn-primary" onclick="showEditModal()">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;">
                            <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        添加商品
                    </button>
                </div>
            </div>

            <!-- 商品列表 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        我的商品列表
                        <span class="panel-count" id="productCount">0</span>
                    </div>
                </div>
                <div class="product-list" id="productList">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p>暂无商品数据</p>
                <p class="empty-hint">点击"添加商品"开始录入您的货物或服务</p>
            </div>

            <!-- 询价单管理 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <polyline points="10 9 9 9 8 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        询价单管理
                        <span class="panel-count" id="rfqCount">0</span>
                    </div>
                    <div class="panel-actions">
                        <select class="filter-select" id="rfqStatus" onchange="loadRFQs()">
                            <option value="">全部状态</option>
                            <option value="pending">待报价</option>
                            <option value="quoted">已报价</option>
                            <option value="accepted">已达成</option>
                            <option value="rejected">已拒绝</option>
                        </select>
                    </div>
                </div>
                <div class="product-list" id="rfqList">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <div class="empty-state" id="rfqEmptyState" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p>暂无询价单</p>
                <p class="empty-hint">采购人向您发起询价后会显示在这里</p>
            </div>
        </main>
    </div>

    <!-- 编辑/添加商品弹窗 -->
    <div class="modal" id="editModal" style="display:none;">
        <div class="modal-backdrop" onclick="closeEditModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <div class="modal-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="modalTitle">添加商品</h3>
                        <p>录入货物或服务信息</p>
                    </div>
                </div>
                <button class="modal-close" onclick="closeEditModal()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="editForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="editProductId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">商品类型 <span class="form-required">*</span></label>
                            <select id="editProductType" onchange="loadEditCategories()">
                                <option value="goods">货物</option>
                                <option value="service">服务</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">商品名称 <span class="form-required">*</span></label>
                            <input type="text" id="editTitle" placeholder="请输入商品名称" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">一级分类</label>
                            <select id="editMainCategory" onchange="loadEditSubCategories()">
                                <option value="">请选择</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">二级分类</label>
                            <select id="editSubCategory">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">规格型号</label>
                            <input type="text" id="editSpec" placeholder="如：100个/箱">
                        </div>
                        <div class="form-group">
                            <label class="form-label">单位</label>
                            <input type="text" id="editUnit" placeholder="如：台、箱、年">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">价格 (元) <span class="form-required">*</span></label>
                            <input type="number" id="editPrice" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">最小起订量</label>
                            <input type="number" id="editMinOrder" value="1" min="1">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">批量折扣</label>
                            <input type="text" id="editBulkDiscount" placeholder="如：10台以上95折">
                        </div>
                        <div class="form-group">
                            <label class="form-label">交货周期</label>
                            <input type="text" id="editDeliveryCycle" placeholder="如：3-5工作日">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">质保天数</label>
                            <input type="number" id="editWarrantyDays" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">状态</label>
                            <select id="editStatus">
                                <option value="active">上架</option>
                                <option value="inactive">下架</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">关键词</label>
                        <input type="text" id="editKeyword" placeholder="用于搜索匹配，多个用空格分隔">
                    </div>
                    <div class="form-group">
                        <label class="form-label">商品描述</label>
                        <textarea id="editDescription" rows="3" placeholder="商品详细描述"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 商品详情弹窗 -->
    <div class="modal" id="detailModal" style="display:none;" onclick="closeDetailModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>商品详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <!-- 报价弹窗 -->
    <div class="modal" id="quoteModal" style="display:none;">
        <div class="modal-backdrop" onclick="closeQuoteModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <div class="modal-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="white" stroke-width="2"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="quoteModalTitle">报价回应</h3>
                        <p>对询价单进行报价或拒绝</p>
                    </div>
                </div>
                <button class="modal-close" onclick="closeQuoteModal()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="quoteRfqInfo" style="margin-bottom: 20px; padding: 15px; background: var(--bg-hover); border-radius: var(--radius-md);">
                </div>
                <form id="quoteForm" onsubmit="submitQuote(event)">
                    <input type="hidden" id="quoteRfqId">
                    <div class="form-group">
                        <label class="form-label">回应方式</label>
                        <div style="display: flex; gap: 12px;">
                            <label style="display: flex; align-items: center; gap: 6px;">
                                <input type="radio" name="quoteAction" value="accept" checked>
                                <span>接受并报价</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 6px;">
                                <input type="radio" name="quoteAction" value="reject">
                                <span>拒绝报价</span>
                            </label>
                        </div>
                    </div>
                    <div id="quotePriceSection">
                        <div class="form-group">
                            <label class="form-label">报价金额 (元)</label>
                            <input type="number" id="quotePrice" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">回应备注</label>
                        <textarea id="quoteResponse" rows="3" placeholder="请输入回应内容..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeQuoteModal()">取消</button>
                        <button type="submit" class="btn btn-primary">提交</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/bijia';
        let currentUser = null;
        let categoriesData = {};
        let allProducts = [];

        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = API_BASE + '/login';
                return false;
            }
            try {
                const resp = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (resp.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = API_BASE + '/login';
                    return false;
                }
                const data = await resp.json();
                if (data && data.user && data.user.role === 'supplier') {
                    currentUser = data.user;
                    document.getElementById('userName').textContent = currentUser.username;
                    document.getElementById('userAvatar').textContent = currentUser.username?.charAt(0).toUpperCase() || 'U';
                    if (currentUser.company_name) {
                        document.getElementById('supplierName').textContent = currentUser.company_name + ' - 管理我的货物与服务';
                    }
                    return true;
                } else {
                    alert('非供应商账号，请从正确的入口登录');
                    window.location.href = API_BASE + '/login';
                    return false;
                }
            } catch (e) {
                window.location.href = API_BASE + '/login';
                return false;
            }
        }

        function toggleUserDropdown(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) dropdown.classList.toggle('show');
        }

        document.addEventListener('click', () => {
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) dropdown.classList.remove('show');
        });

        function handleLogout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = API_BASE + '/login';
            }
        }

        function getToken() {
            return localStorage.getItem('token') || '';
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = { ...options.headers };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (options.body && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }
            const resp = await fetch(`${API_BASE}${url}`, { ...options, headers });
            const data = await resp.json();
            if (resp.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = API_BASE + '/login';
                return null;
            }
            return data;
        }

        async function loadCategories() {
            const productType = document.getElementById('productType').value;
            if (!productType) {
                document.getElementById('mainCategory').innerHTML = '<option value="">全部</option>';
                document.getElementById('subCategory').innerHTML = '<option value="">全部</option>';
                return;
            }
            try {
                const resp = await apiFetch(`/api/categories?type=${productType}`);
                categoriesData = resp.categories || {};
                const mainCatSelect = document.getElementById('mainCategory');
                mainCatSelect.innerHTML = '<option value="">全部</option>';
                Object.keys(categoriesData).forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    mainCatSelect.appendChild(option);
                });
                document.getElementById('subCategory').innerHTML = '<option value="">全部</option>';
            } catch (e) { console.error(e); }
        }

        function loadSubCategories() {
            const mainCategory = document.getElementById('mainCategory').value;
            const subCatSelect = document.getElementById('subCategory');
            subCatSelect.innerHTML = '<option value="">全部</option>';
            if (!mainCategory) return;
            const subs = categoriesData[mainCategory] || [];
            subs.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                subCatSelect.appendChild(option);
            });
        }

        function resetFilters() {
            document.getElementById('productType').value = '';
            document.getElementById('mainCategory').innerHTML = '<option value="">全部</option>';
            document.getElementById('subCategory').innerHTML = '<option value="">全部</option>';
            document.getElementById('searchKeyword').value = '';
            loadProducts();
        }

        async function loadProducts() {
            const grid = document.getElementById('productList');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>加载中...</p></div>';
            emptyState.style.display = 'none';

            const params = new URLSearchParams();
            params.set('limit', '200');
            const productType = document.getElementById('productType').value;
            if (productType) params.set('product_type', productType);
            const mainCategory = document.getElementById('mainCategory').value;
            if (mainCategory) params.set('main_category', mainCategory);
            const subCategory = document.getElementById('subCategory').value;
            if (subCategory) params.set('sub_category', subCategory);
            const keyword = document.getElementById('searchKeyword').value.trim();
            if (keyword) params.set('keyword', keyword);

            try {
                const data = await apiFetch(`/api/supplier-products?${params.toString()}`);
                if (data && data.products) {
                    allProducts = data.products;
                    renderProducts(data.products);
                    updateStats(data.products);
                }
            } catch (e) {
                grid.innerHTML = '<div class="empty-state"><p>加载失败，请重试</p></div>';
            }
        }

        function updateStats(products) {
            const goods = products.filter(p => p.product_type === 'goods');
            const services = products.filter(p => p.product_type === 'service');
            const avgPrice = products.length > 0
                ? (products.reduce((s, p) => s + parseFloat(p.price || 0), 0) / products.length).toFixed(2)
                : '0';
            document.getElementById('goodsCount').textContent = goods.length;
            document.getElementById('serviceCount').textContent = services.length;
            document.getElementById('avgPrice').textContent = avgPrice;
            document.getElementById('totalCount').textContent = products.length;
            document.getElementById('productCount').textContent = products.length;
        }

        function renderProducts(products) {
            const grid = document.getElementById('productList');
            const emptyState = document.getElementById('emptyState');

            if (!products || products.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            grid.innerHTML = products.map(p => {
                const typeText = p.product_type === 'service' ? '服务' : '货物';
                const typeClass = p.product_type === 'service' ? 'tag-service' : 'tag-goods';
                const statusText = p.status === 'active' ? '上架中' : '已下架';
                const statusClass = p.status === 'active' ? 'status-active' : 'status-inactive';
                return `
                    <div class="product-card">
                        <div class="product-card-header">
                            <div class="product-card-info">
                                <div class="product-tags">
                                    <span class="tag ${typeClass}">${typeText}</span>
                                    ${p.main_category ? `<span class="tag tag-category">${p.main_category}</span>` : ''}
                                    ${p.sub_category ? `<span class="tag tag-sub-category">${p.sub_category}</span>` : ''}
                                    <span class="tag ${statusClass}">${statusText}</span>
                                </div>
                                <h3 class="product-title">${p.title}</h3>
                                <p class="product-spec">${p.spec || '无规格'}</p>
                            </div>
                            <div class="product-card-price">
                                <span class="price">¥${parseFloat(p.price || 0).toFixed(2)}</span>
                                <span class="unit">/${p.unit || '件'}</span>
                            </div>
                        </div>
                        <div class="product-card-meta">
                            <span>起订量：${p.min_order || 1}</span>
                            <span>交货周期：${p.delivery_cycle || '-'}</span>
                            <span>质保：${p.warranty_days || 0}天</span>
                        </div>
                        <div class="product-card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="showDetail(${p.id})">详情</button>
                            <button class="btn btn-sm btn-primary" onclick="editProduct(${p.id})">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id}, '${p.title.replace(/'/g, "\\'")}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function showDetail(productId) {
            const p = allProducts.find(x => x.id === productId);
            if (!p) return;
            const typeText = p.product_type === 'service' ? '服务' : '货物';
            const statusText = p.status === 'active' ? '上架中' : '已下架';
            document.getElementById('detailBody').innerHTML = `
                <div class="detail-section">
                    <div class="detail-tags">
                        <span class="tag tag-goods">${typeText}</span>
                        <span class="tag tag-category">${p.main_category || '未分类'}</span>
                        ${p.sub_category ? `<span class="tag tag-sub-category">${p.sub_category}</span>` : ''}
                    </div>
                    <h2>${p.title}</h2>
                    <p class="detail-spec">${p.spec || '无规格信息'}</p>
                    <div class="detail-price">
                        <span class="price">¥${parseFloat(p.price).toFixed(2)}</span>
                        <span class="unit">/${p.unit || '件'}</span>
                    </div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><label>最小起订量</label><span>${p.min_order || 1}</span></div>
                    <div class="detail-item"><label>批量折扣</label><span>${p.bulk_discount || '-'}</span></div>
                    <div class="detail-item"><label>交货周期</label><span>${p.delivery_cycle || '-'}</span></div>
                    <div class="detail-item"><label>质保天数</label><span>${p.warranty_days || 0} 天</span></div>
                    <div class="detail-item"><label>状态</label><span>${statusText}</span></div>
                    <div class="detail-item"><label>关键词</label><span>${p.keyword || '-'}</span></div>
                </div>
                ${p.description ? `<div class="detail-desc"><h4>商品描述</h4><p>${p.description}</p></div>` : ''}
                <div class="detail-time">
                    <p>创建时间：${p.created_at || '-'}</p>
                    <p>更新时间：${p.updated_at || '-'}</p>
                </div>
            `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function showEditModal() {
            document.getElementById('modalTitle').textContent = '添加商品';
            document.getElementById('editForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('editMainCategory').innerHTML = '<option value="">请选择</option>';
            document.getElementById('editSubCategory').innerHTML = '<option value="">请选择</option>';
            document.getElementById('editModal').style.display = 'flex';
        }

        async function editProduct(productId) {
            const p = allProducts.find(x => x.id === productId);
            if (!p) return;
            document.getElementById('modalTitle').textContent = '编辑商品';
            document.getElementById('editProductId').value = p.id;
            document.getElementById('editProductType').value = p.product_type || 'goods';
            document.getElementById('editTitle').value = p.title || '';
            document.getElementById('editSpec').value = p.spec || '';
            document.getElementById('editUnit').value = p.unit || '';
            document.getElementById('editPrice').value = p.price || '';
            document.getElementById('editMinOrder').value = p.min_order || 1;
            document.getElementById('editBulkDiscount').value = p.bulk_discount || '';
            document.getElementById('editDeliveryCycle').value = p.delivery_cycle || '';
            document.getElementById('editWarrantyDays').value = p.warranty_days || 0;
            document.getElementById('editStatus').value = p.status || 'active';
            document.getElementById('editKeyword').value = p.keyword || '';
            document.getElementById('editDescription').value = p.description || '';
            await loadEditCategories();
            if (p.main_category) document.getElementById('editMainCategory').value = p.main_category;
            if (p.sub_category) {
                await loadEditSubCategories();
                document.getElementById('editSubCategory').value = p.sub_category;
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        async function loadEditCategories() {
            const productType = document.getElementById('editProductType').value;
            if (!productType) return;
            try {
                const resp = await apiFetch(`/api/categories?type=${productType}`);
                const cats = resp.categories || {};
                const mainCatSelect = document.getElementById('editMainCategory');
                mainCatSelect.innerHTML = '<option value="">请选择</option>';
                Object.keys(cats).forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    mainCatSelect.appendChild(option);
                });
                document.getElementById('editSubCategory').innerHTML = '<option value="">请选择</option>';
            } catch (e) { console.error(e); }
        }

        async function loadEditSubCategories() {
            const productType = document.getElementById('editProductType').value;
            const mainCategory = document.getElementById('editMainCategory').value;
            if (!mainCategory) return;
            try {
                const resp = await apiFetch(`/api/categories?type=${productType}&main_category=${encodeURIComponent(mainCategory)}`);
                const subs = resp.sub_categories || [];
                const subCatSelect = document.getElementById('editSubCategory');
                subCatSelect.innerHTML = '<option value="">请选择</option>';
                subs.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    subCatSelect.appendChild(option);
                });
            } catch (e) { console.error(e); }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const productId = document.getElementById('editProductId').value;
            const payload = {
                product_type: document.getElementById('editProductType').value,
                title: document.getElementById('editTitle').value.trim(),
                main_category: document.getElementById('editMainCategory').value,
                sub_category: document.getElementById('editSubCategory').value,
                spec: document.getElementById('editSpec').value.trim(),
                unit: document.getElementById('editUnit').value.trim(),
                price: parseFloat(document.getElementById('editPrice').value),
                min_order: parseInt(document.getElementById('editMinOrder').value) || 1,
                bulk_discount: document.getElementById('editBulkDiscount').value.trim(),
                delivery_cycle: document.getElementById('editDeliveryCycle').value.trim(),
                warranty_days: parseInt(document.getElementById('editWarrantyDays').value) || 0,
                status: document.getElementById('editStatus').value,
                keyword: document.getElementById('editKeyword').value.trim(),
                description: document.getElementById('editDescription').value.trim(),
            };

            try {
                let data;
                if (productId) {
                    data = await apiFetch(`/api/supplier-products/${productId}`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });
                } else {
                    data = await apiFetch(`/api/supplier-products`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                }
                if (data && data.success) {
                    closeEditModal();
                    await loadProducts();
                } else if (data) {
                    alert(data.error || '保存失败');
                }
            } catch (e) {
                alert('网络错误，请重试');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function loadRFQs() {
            const grid = document.getElementById('rfqList');
            const emptyState = document.getElementById('rfqEmptyState');
            grid.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>加载中...</p></div>';
            emptyState.style.display = 'none';

            const status = document.getElementById('rfqStatus').value;
            const params = new URLSearchParams();
            if (status) params.set('status', status);

            try {
                const data = await apiFetch(`/api/rfq?${params.toString()}`);
                if (data && data.rfqs) {
                    renderRFQs(data.rfqs);
                }
            } catch (e) {
                grid.innerHTML = '<div class="empty-state"><p>加载失败，请重试</p></div>';
            }
        }

        function renderRFQs(rfqs) {
            const grid = document.getElementById('rfqList');
            const emptyState = document.getElementById('rfqEmptyState');

            if (!rfqs || rfqs.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            document.getElementById('rfqCount').textContent = rfqs.length;

            grid.innerHTML = rfqs.map(r => {
                const typeText = r.product_type === 'service' ? '服务' : '货物';
                const typeClass = r.product_type === 'service' ? 'tag-service' : 'tag-goods';
                
                const statusMap = {
                    'pending': { text: '待报价', class: 'tag-warning' },
                    'quoted': { text: '已报价', class: 'tag-primary' },
                    'accepted': { text: '已达成', class: 'tag-success' },
                    'rejected': { text: '已拒绝', class: 'tag-danger' }
                };
                const statusInfo = statusMap[r.status] || { text: r.status, class: 'tag-category' };

                return `
                    <div class="product-card">
                        <div class="product-card-header">
                            <div class="product-card-info">
                                <div class="product-tags">
                                    <span class="tag ${typeClass}">${typeText}</span>
                                    <span class="tag ${statusInfo.class}">${statusInfo.text}</span>
                                </div>
                                <h3 class="product-title">${r.title}</h3>
                                <p class="product-spec">规格：${r.spec || '-'} | 数量：${r.quantity}${r.unit || ''}</p>
                            </div>
                            <div class="product-card-price">
                                <span class="price">¥${parseFloat(r.expected_price || 0).toFixed(2)}</span>
                                <span class="unit">期望价</span>
                            </div>
                        </div>
                        <div class="product-card-meta">
                            <span>采购人：${r.buyer_name || '-'}</span>
                            <span>交货要求：${r.delivery_requirement || '-'}</span>
                            <span>创建时间：${r.created_at || '-'}</span>
                        </div>
                        ${r.supplier_quote > 0 ? `<div style="padding: 10px; background: rgba(34,197,94,0.1); border-radius: 6px; margin-bottom: 12px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="color: #4ade80;">已报价：¥${parseFloat(r.supplier_quote).toFixed(2)}</span>
                                ${r.quote_response ? `<span style="font-size: 12px; color: var(--text-secondary);">${r.quote_response}</span>` : ''}
                            </div>
                        </div>` : ''}
                        <div class="product-card-actions">
                            ${r.status === 'pending' ? `<button class="btn btn-sm btn-primary" onclick="showQuoteModal(${r.id}, '${r.title.replace(/'/g, "\\'")}')">报价回应</button>` : ''}
                            <button class="btn btn-sm btn-secondary" onclick="showRfqDetail(${r.id})">详情</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function showRfqDetail(rfqId) {
            try {
                const data = await apiFetch(`/api/rfq/${rfqId}`);
                if (data && data.rfq) {
                    const r = data.rfq;
                    const typeText = r.product_type === 'service' ? '服务' : '货物';
                    const statusMap = {
                        'pending': '待报价',
                        'quoted': '已报价',
                        'accepted': '已达成',
                        'rejected': '已拒绝'
                    };
                    document.getElementById('detailBody').innerHTML = `
                        <div class="detail-section">
                            <div class="detail-tags">
                                <span class="tag tag-goods">${typeText}</span>
                                <span class="tag tag-primary">${statusMap[r.status] || r.status}</span>
                            </div>
                            <h2>${r.title}</h2>
                            <p class="detail-spec">${r.spec || '无规格信息'}</p>
                            <div class="detail-price">
                                <span class="price">¥${parseFloat(r.expected_price).toFixed(2)}</span>
                                <span class="unit">期望价格</span>
                            </div>
                        </div>
                        <div class="detail-grid">
                            <div class="detail-item"><label>采购数量</label><span>${r.quantity} ${r.unit || '件'}</span></div>
                            <div class="detail-item"><label>采购人</label><span>${r.buyer_name || '-'}</span></div>
                            <div class="detail-item"><label>交货要求</label><span>${r.delivery_requirement || '-'}</span></div>
                            <div class="detail-item"><label>询价状态</label><span>${statusMap[r.status] || r.status}</span></div>
                        </div>
                        ${r.supplier_quote > 0 ? `<div class="detail-desc">
                            <h4>供应商报价</h4>
                            <p style="font-size: 18px; color: #4ade80; font-weight: 700;">¥${parseFloat(r.supplier_quote).toFixed(2)}</p>
                            ${r.quote_response ? `<p>${r.quote_response}</p>` : ''}
                        </div>` : ''}
                        <div class="detail-time">
                            <p>创建时间：${r.created_at || '-'}</p>
                            <p>更新时间：${r.updated_at || '-'}</p>
                        </div>
                    `;
                    document.getElementById('detailModal').style.display = 'flex';
                }
            } catch (e) {
                alert('加载详情失败');
            }
        }

        let currentQuoteRfq = null;

        async function showQuoteModal(rfqId, title) {
            currentQuoteRfq = rfqId;
            document.getElementById('quoteRfqId').value = rfqId;
            document.getElementById('quoteForm').reset();

            try {
                const data = await apiFetch(`/api/rfq/${rfqId}`);
                if (data && data.rfq) {
                    const r = data.rfq;
                    document.getElementById('quoteRfqInfo').innerHTML = `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-weight: 600;">${r.title}</span>
                            <span class="tag tag-warning">待报价</span>
                        </div>
                        <div style="font-size: 13px; color: var(--text-secondary);">
                            <p>规格：${r.spec || '-'} | 数量：${r.quantity}${r.unit || ''}</p>
                            <p>采购人期望价：¥${parseFloat(r.expected_price).toFixed(2)}</p>
                            <p>采购人：${r.buyer_name || '-'}</p>
                        </div>
                    `;
                }
            } catch (e) { console.error(e); }

            document.getElementById('quoteModal').style.display = 'flex';
        }

        function closeQuoteModal() {
            document.getElementById('quoteModal').style.display = 'none';
            currentQuoteRfq = null;
        }

        document.querySelectorAll('input[name="quoteAction"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const priceSection = document.getElementById('quotePriceSection');
                priceSection.style.display = this.value === 'accept' ? 'block' : 'none';
                const priceInput = document.getElementById('quotePrice');
                priceInput.required = this.value === 'accept';
            });
        });

        async function submitQuote(e) {
            e.preventDefault();
            const rfqId = document.getElementById('quoteRfqId').value;
            const action = document.querySelector('input[name="quoteAction"]:checked').value;
            const response = document.getElementById('quoteResponse').value.trim();

            if (action === 'accept') {
                const price = parseFloat(document.getElementById('quotePrice').value);
                if (!price || price <= 0) {
                    alert('请输入有效报价金额');
                    return;
                }
                try {
                    const data = await apiFetch(`/api/rfq/${rfqId}/quote`, {
                        method: 'POST',
                        body: JSON.stringify({
                            supplier_quote: price,
                            quote_response: response || '同意报价'
                        })
                    });
                    if (data && data.success) {
                        closeQuoteModal();
                        await loadRFQs();
                    } else if (data) {
                        alert(data.error || '报价失败');
                    }
                } catch (e) {
                    alert('网络错误，请重试');
                }
            } else {
                try {
                    const data = await apiFetch(`/api/rfq/${rfqId}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            status: 'rejected',
                            quote_response: response || '无法满足该询价'
                        })
                    });
                    if (data && data.success) {
                        closeQuoteModal();
                        await loadRFQs();
                    } else if (data) {
                        alert(data.error || '操作失败');
                    }
                } catch (e) {
                    alert('网络错误，请重试');
                }
            }
        }

        async function deleteProduct(productId, title) {
            if (!confirm(`确定要删除商品「${title}」吗？删除后不可恢复。`)) return;
            try {
                const data = await apiFetch(`/api/supplier-products/${productId}`, { method: 'DELETE' });
                if (data && data.success) {
                    await loadProducts();
                } else if (data) {
                    alert(data.error || '删除失败');
                }
            } catch (e) {
                alert('网络错误，请重试');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const isAuthed = await checkAuth();
            if (isAuthed) {
                await Promise.all([loadProducts(), loadRFQs()]);
            }
        });
    </script>
</body>
</html>
