<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>信息资源库（汇总表）</title>
<style>
  :root {
    --primary: #14731C;
    --primary-light: #e8f5e9;
    --gold: #D97706;
    --gold-light: #fff8e1;
    --bg: #f5f7f5;
    --card-bg: #ffffff;
    --text: #1A3B1A;
    --text-secondary: #666;
    --border: #e0e0e0;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* 顶部固定区 */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(135deg, var(--primary) 0%, #0d5c13 100%);
    padding: 16px 16px 12px;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header h1::before {
    content: '📋';
    font-size: 20px;
  }

  /* 搜索框 */
  .search-box {
    position: relative;
    margin-bottom: 10px;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    background: rgba(255,255,255,0.95);
    color: var(--text);
    outline: none;
  }
  .search-box input::placeholder { color: #999; }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
  }

  /* 区县筛选标签 */
  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-tag {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-tag.active {
    background: #fff;
    color: var(--primary);
    border-color: #fff;
    font-weight: 700;
  }

  /* 统计信息 */
  .stats {
    padding: 12px 16px 8px;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stats strong { color: var(--primary); font-size: 16px; }

  /* 项目卡片 */
  .card-list { padding: 0 12px 20px; }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: transform 0.15s;
    cursor: pointer;
    border-left: 4px solid var(--primary);
  }
  .card:active { transform: scale(0.98); }
  .card-header {
    padding: 14px 16px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }
  .card-badge {
    flex-shrink: 0;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: var(--primary-light);
    color: var(--primary);
    white-space: nowrap;
  }
  .card-body {
    padding: 0 16px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
  }
  .card-field {
    display: flex;
    flex-direction: column;
    font-size: 12px;
  }
  .card-field.full { grid-column: 1 / -1; }
  .field-label {
    color: var(--text-secondary);
    font-size: 11px;
    margin-bottom: 2px;
  }
  .field-value {
    color: var(--text);
    font-weight: 500;
    word-break: break-all;
  }
  .card-footer {
    padding: 10px 16px;
    background: #fafafa;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-footer .detail-btn {
    color: var(--primary);
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* 详情弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    justify-content: flex-end;
    align-items: flex-end;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    width: 100%;
    max-height: 85vh;
    border-radius: 20px 20px 0 0;
    overflow-y: auto;
    padding: 24px 20px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .modal-section {
    margin-bottom: 18px;
  }
  .modal-section h3 {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .modal-section p {
    font-size: 15px;
    color: var(--text);
    line-height: 1.6;
    background: var(--bg);
    padding: 10px 14px;
    border-radius: 8px;
  }
  .modal-close {
    position: sticky;
    bottom: 0;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  /* 回到顶部 */
  .back-top {
    position: fixed;
    bottom: 24px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    cursor: pointer;
    display: none;
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .back-top.show { display: flex; }

  /* 资产类型颜色映射 */
  .type-房屋 { background: #e8f5e9; color: #2e7d32; }
  .type-果园 { background: #fff8e1; color: #f57f17; }
  .type-养殖 { background: #e3f2fd; color: #1565c0; }
  .type-农房 { background: #fce4ec; color: #c62828; }
  .type-土地 { background: #f3e5f5; color: #6a1b9a; }
  .type-其他 { background: #efebe9; color: #4e342e; }
</style>
</head>
<body>

<div class="header">
  <h1>信息资源库（汇总表）</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索项目名称、编号、区县..." oninput="filterCards()">
  </div>
  <div class="filter-bar" id="filterBar"></div>
</div>

<div class="stats">
  <span>共 <strong id="totalCount">0</strong> 个项目</span>
  <span id="filterCount"></span>
</div>

<div class="card-list" id="cardList"></div>

<div class="empty-state" id="emptyState" style="display:none">
  <div class="icon">🔍</div>
  <p>未找到匹配的项目</p>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// 渲染筛选标签
function renderFilters() {
  const bar = document.getElementById('filterBar');
  const counties = ['全部', ...new Set(RAW_DATA.map(d => d[2]).filter(Boolean))];
  bar.innerHTML = counties.map(c => 
    `<div class="filter-tag ${c === '全部' ? 'active' : ''}" onclick="selectFilter('${c}')">${c}</div>`
  ).join('');
}

let currentFilter = '全部';

function selectFilter(county) {
  currentFilter = county;
  document.querySelectorAll('.filter-tag').forEach(t => {
    t.classList.toggle('active', t.textContent === county);
  });
  filterCards();
}

// 渲染卡片
function renderCards(data) {
  const list = document.getElementById('cardList');
  const empty = document.getElementById('emptyState');
  document.getElementById('totalCount').textContent = RAW_DATA.length;
  document.getElementById('filterCount').textContent = 
    data.length !== RAW_DATA.length ? `筛选后 ${data.length} 个` : '';

  if (data.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = data.map((d, i) => {
    const [seq, code, county, type, name, location, area, period, detail] = d;
    // 资产类型样式类
    let typeClass = '其他';
    if (type.includes('房屋')) typeClass = '房屋';
    else if (type.includes('果园')) typeClass = '果园';
    else if (type.includes('养殖') || type.includes('产业')) typeClass = '养殖';
    else if (type.includes('农房') || type.includes('闲置')) typeClass = '农房';
    else if (type.includes('土地') || type.includes('耕地') || type.includes('林地')) typeClass = '土地';

    return `
    <div class="card" onclick="openDetail(${JSON.stringify(d).replace(/"/g, '&quot;')})">
      <div class="card-header">
        <div class="card-title">${name || '暂无名称'}</div>
        <div class="card-badge type-${typeClass}">${type || '未知'}</div>
      </div>
      <div class="card-body">
        <div class="card-field">
          <span class="field-label">编号</span>
          <span class="field-value">${code || '-'}</span>
        </div>
        <div class="card-field">
          <span class="field-label">区县</span>
          <span class="field-value">${county || '-'}</span>
        </div>
        <div class="card-field">
          <span class="field-label">项目所在地</span>
          <span class="field-value">${location || '-'}</span>
        </div>
        <div class="card-field">
          <span class="field-label">面积</span>
          <span class="field-value">${area || '-'}</span>
        </div>
        ${period ? `<div class="card-field">
          <span class="field-label">期限</span>
          <span class="field-value">${period}</span>
        </div>` : ''}
      </div>
      <div class="card-footer">
        <span>${detail ? detail.substring(0, 30) + (detail.length > 30 ? '...' : '') : '暂无详情'}</span>
        <span class="detail-btn">查看详情 →</span>
      </div>
    </div>`;
  }).join('');
}

// 筛选逻辑
function filterCards() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  let data = RAW_DATA;

  if (currentFilter !== '全部') {
    data = data.filter(d => d[2] === currentFilter);
  }
  if (keyword) {
    data = data.filter(d => 
      d.some(f => f && f.toString().toLowerCase().includes(keyword))
    );
  }
  renderCards(data);
}

// 详情弹窗
function openDetail(d) {
  const [seq, code, county, type, name, location, area, period, detail] = d;
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${name || '项目详情'}</div>

    <div class="modal-section">
      <h3>项目编号</h3>
      <p>${code || '-'}</p>
    </div>
    <div class="modal-section">
      <h3>资产类型</h3>
      <p>${type || '-'}</p>
    </div>
    <div class="modal-section">
      <h3>区县</h3>
      <p>${county || '-'}</p>
    </div>
    <div class="modal-section">
      <h3>项目所在地</h3>
      <p>${location || '-'}</p>
    </div>
    <div class="modal-section">
      <h3>面积</h3>
      <p>${area || '-'}</p>
    </div>
    ${period ? `<div class="modal-section">
      <h3>期限</h3>
      <p>${period}</p>
    </div>` : ''}
    <div class="modal-section">
      <h3>详细情况</h3>
      <p style="white-space:pre-wrap">${detail || '暂无详细信息'}</p>
    </div>

    <button class="modal-close" onclick="closeModal()">关闭</button>
  `;
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// 回到顶部按钮
window.addEventListener('scroll', () => {
  document.getElementById('backTop').classList.toggle('show', window.scrollY > 400);
});

// 初始化
renderFilters();
renderCards(RAW_DATA);
</script>

</body>
</html>
